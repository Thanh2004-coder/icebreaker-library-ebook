server.port=${PORT:8080}

# Compose JDBC from env vars. Production (Aiven):
#   DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD, DB_SSL_MODE=REQUIRED
# Optional full override: DB_URL
# Password must come from the environment — never commit it.
app.db.host=${DB_HOST:localhost}
app.db.port=${DB_PORT:3306}
app.db.name=${DB_NAME:game_warmup_ebook}
app.db.ssl-mode=${DB_SSL_MODE:DISABLED}

spring.datasource.url=${DB_URL:jdbc:mysql://${app.db.host}:${app.db.port}/${app.db.name}?sslMode=${app.db.ssl-mode}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Comma-separated origins. Production should set CORS_ORIGINS, not localhost.
app.cors.origins=${CORS_ORIGINS:http://localhost:5174,http://127.0.0.1:5174,http://localhost:4174,http://127.0.0.1:4174}
